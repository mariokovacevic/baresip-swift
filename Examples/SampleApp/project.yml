name: BaresipKitSample
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    BSK_APP_GROUP: group.com.example.BaresipKitSample
packages:
  BaresipKit:
    path: ../..
targets:
  BaresipKitSample:
    type: application
    platform: iOS
    sources: [SampleApp, Shared]
    dependencies:
      - target: BaresipKitSamplePreview
      - package: BaresipKit
        product: BaresipKit
      - package: BaresipKit
        product: BaresipKitAudio
      - package: BaresipKit
        product: BaresipKitVideo
      - package: BaresipKit
        product: BaresipKitCallKit
      - package: BaresipKit
        product: BaresipKitLiveCommunication
      - package: BaresipKit
        product: BaresipKitPushKit
      - package: BaresipKit
        product: BaresipKitSwiftUI
    info:
      path: SampleApp/Info.plist
      properties:
        CFBundleDisplayName: Zvono
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts: [BarlowSemiCondensed-Medium.ttf, BarlowSemiCondensed-SemiBold.ttf]
        NSMicrophoneUsageDescription: "Needed for SIP calls."
        NSCameraUsageDescription: "Needed for video calls."
        NSFaceIDUsageDescription: "Confirms it is you before a door opens."
        UIBackgroundModes: [audio, voip]
        NSUserActivityTypes: [INStartCallIntent]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        BSKAppGroup: $(BSK_APP_GROUP)
    entitlements:
      path: SampleApp/BaresipKitSample.entitlements
      properties:
        com.apple.security.application-groups: [$(BSK_APP_GROUP)]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    scheme:
      testTargets:
        - BaresipKitSampleUITests
  BaresipKitSamplePreview:
    type: app-extension
    platform: iOS
    sources: [PreviewExtension, Shared]
    info:
      path: PreviewExtension/Info.plist
      properties:
        CFBundleDisplayName: Call preview
        BSKAppGroup: $(BSK_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: [BSK_INCOMING_PREVIEW, BSK_INCOMING_PREVIEW_DOOR]
            UNNotificationExtensionInitialContentSizeRatio: 0.75
    entitlements:
      path: PreviewExtension/BaresipKitSamplePreview.entitlements
      properties:
        com.apple.security.application-groups: [$(BSK_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.BaresipKitSample.Preview
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  BaresipKitSampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: BaresipKitSample
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
