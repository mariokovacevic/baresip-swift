name: BaresipKitSample
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
packages:
  BaresipKit:
    path: ../..
targets:
  BaresipKitSample:
    type: application
    platform: iOS
    sources: [SampleApp]
    dependencies:
      - package: BaresipKit
        product: BaresipKit
      - package: BaresipKit
        product: BaresipKitAudio
      - package: BaresipKit
        product: BaresipKitVideo
      - package: BaresipKit
        product: BaresipKitCallKit
      - package: BaresipKit
        product: BaresipKitPushKit
      - package: BaresipKit
        product: BaresipKitSwiftUI
    info:
      path: SampleApp/Info.plist
      properties:
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Needed for SIP calls."
        NSCameraUsageDescription: "Needed for video calls."
        UIBackgroundModes: [audio, voip]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    scheme:
      testTargets:
        - BaresipKitSampleUITests
  BaresipKitSampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: BaresipKitSample
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
