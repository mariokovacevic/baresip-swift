[general]
static=yes
writeprotect=yes

[doors]
exten => _1XX,1,NoOp(${CALLERID(num)} rings ${EXTEN})
 same => n,Ringing()
 same => n,Set(__CALLUUID=${UUID()})
 same => n,Set(CONTACTS=${PJSIP_AOR(${EXTEN},contact)})
 same => n,GotoIf($["${CONTACTS}" = ""]?unregistered)
 same => n,Set(CONTACT=${CUT(CONTACTS,\,,1)})
 same => n,Set(URI=${PJSIP_CONTACT(${CONTACT},uri)})
 same => n,GotoIf($[${REGEX("pn-tok=" ${URI})} = 0]?dial)
 same => n,Set(BEFORE=${CONTACT}/${PJSIP_CONTACT(${CONTACT},expiration_time)})
 same => n,UserEvent(BSKPush,Resident: ${EXTEN},Contact: ${URI},Caller: ${CALLERID(num)},CallerName: ${CALLERID(name)},Video: 1,CallUUID: ${CALLUUID})
 same => n,Set(TRIES=0)
 same => n(wait),Wait(0.25)
 same => n,Set(TRIES=$[${TRIES} + 1])
 same => n,Set(CONTACTS=${PJSIP_AOR(${EXTEN},contact)})
 same => n,Set(CONTACT=${CUT(CONTACTS,\,,1)})
 same => n,GotoIf($["${CONTACT}" = ""]?again)
 same => n,Set(AFTER=${CONTACT}/${PJSIP_CONTACT(${CONTACT},expiration_time)})
 same => n,GotoIf($["${AFTER}" != "${BEFORE}"]?dial)
 same => n(again),GotoIf($[${TRIES} < 40]?wait)
 same => n,NoOp(${EXTEN} did not register after the push)
 same => n(dial),Dial(PJSIP/${EXTEN},45,b(call-uuid^s^1))
 same => n,Hangup()
 same => n(unregistered),NoOp(${EXTEN} has no registration)
 same => n,Hangup(20)

[call-uuid]
exten => s,1,Set(PJSIP_HEADER(add,X-Call-UUID)=${CALLUUID})
 same => n,Return()

[residents]
exten => _1XX,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
exten => door1,1,Dial(PJSIP/door1,30)
 same => n,Hangup()

; Chat: SIP MESSAGE between residents, and to the door station.
[messages]
exten => _1XX,1,MessageSend(pjsip:${EXTEN},${MESSAGE(from)})
 same => n,Hangup()
exten => door1,1,MessageSend(pjsip:door1,${MESSAGE(from)})
 same => n,Hangup()
