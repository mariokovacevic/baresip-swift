[global]
type=global
user_agent=BaresipKit DoorStack

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/doorstack/keys/asterisk.pem
priv_key_file=/etc/asterisk/doorstack/keys/asterisk.key
method=tlsv1_2

[endpoint-template](!)
type=endpoint
disallow=all
; No Opus: this Asterisk cannot translate it, and a phone that got Opus heard nothing from a
; door on G.711. Every call meets on G.711.
allow=ulaw,alaw,h264
message_context=messages
; A phone's hold goes through to the other phone, which hears the music the holding phone
; plays, as with PBXs that do not play their own.
moh_passthrough=yes
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=yes
media_encryption=no
dtmf_mode=auto

[auth-template](!)
type=auth
auth_type=userpass

[resident-aor](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=0
default_expiration=3600
maximum_expiration=2592000

[door-aor](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=0

[100](endpoint-template)
context=residents
auth=100
aors=100
[100](resident-aor)

[101](endpoint-template)
context=residents
auth=101
aors=101
[101](resident-aor)

[door1](endpoint-template)
context=doors
auth=door1
aors=door1
callerid=Front door <door1>
[door1](door-aor)

#include doorstack/pjsip_secrets.conf
; Written by init.sh: the address phones get behind Docker Desktop's published ports, or nothing.
#include doorstack/pjsip_nat.conf
