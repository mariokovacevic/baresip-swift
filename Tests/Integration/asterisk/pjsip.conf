[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.pem
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2

[endpoint-template](!)
type=endpoint
context=bsk
disallow=all
allow=opus,ulaw,alaw,h264,vp8
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=yes
media_encryption=no
dtmf_mode=auto

[auth-template](!)
type=auth
auth_type=userpass

[aor-template](!)
type=aor
max_contacts=3
remove_existing=yes
qualify_frequency=0

[alice](endpoint-template)
auth=alice
aors=alice
[alice](auth-template)
username=alice
password=alicepass
[alice](aor-template)

[bob](endpoint-template)
auth=bob
aors=bob
[bob](auth-template)
username=bob
password=bobpass
[bob](aor-template)

[carol](endpoint-template)
auth=carol
aors=carol
media_encryption=sdes
media_encryption_optimistic=no
[carol](auth-template)
username=carol
password=carolpass
[carol](aor-template)
