name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  linux-core:
    name: Linux host build, sanitizers, core tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev zlib1g-dev yasm python3 clang libclang-rt-dev
      - name: Cache pinned sources and built prefix
        uses: actions/cache@v4
        with:
          path: |
            Build/.deps
            Build/out/host/prefix
          key: linux-${{ hashFiles('Build/versions.env', 'Build/module-sets.env', 'Patches/*.patch') }}
      - name: Build host prefix (full module set)
        run: PLATFORM=host MODULE_SET=full JOBS=4 Build/build-xcframework.sh
      - name: Run core test suite under ASan/UBSan
        run: HOSTIP=$(hostname -I | awk '{print $1}') PREFIX=Build/out/host/prefix Tests/Core/run_tests.sh
      - name: Fuzz the facade parsers (libFuzzer, 300k runs)
        run: CC=clang RUNS=300000 PREFIX=Build/out/host/prefix Tests/Fuzz/run_fuzz.sh
      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-core-logs
          path: Build/out/host/core-tests/*.txt

  macos:
    name: macOS XCFramework, Swift package, simulator tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
          cmake --version || brew install cmake
      - name: Cache pinned sources and built prefixes
        uses: actions/cache@v4
        with:
          path: |
            Build/.deps
            Build/out/ios-arm64/prefix
            Build/out/ios-arm64-simulator/prefix
            Build/out/host/prefix
          key: macos-${{ hashFiles('Build/versions.env', 'Build/module-sets.env', 'Patches/*.patch') }}
      - name: Build XCFramework (default module set)
        run: MODULE_SET=default JOBS=4 Build/build-xcframework.sh
      - name: Host build and core tests
        run: |
          PLATFORM=host MODULE_SET=full JOBS=4 Build/build-xcframework.sh
          HOSTIP=$(ipconfig getifaddr en0 || ipconfig getifaddr en1) PREFIX=Build/out/host/prefix Tests/Core/run_tests.sh
      - name: Build Swift package for the simulator
        run: |
          xcodebuild build -scheme BaresipKit-Package -destination 'generic/platform=iOS Simulator' ARCHS=arm64 2>&1 | tee package.log | grep -E "error:|warning: .*\.swift|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" package.log
      - name: Run XCTest on a simulator
        run: |
          xcrun simctl list runtimes
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          d = json.load(sys.stdin)["devices"]
          def ver(k):
              m = re.search(r"iOS-(\d+)-(\d+)", k)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          for key in sorted((k for k in d if "iOS" in k), key=ver, reverse=True):
              phones = [x for x in d[key] if x.get("isAvailable") and x["name"].startswith("iPhone")]
              if phones:
                  print(phones[-1]["udid"])
                  break
          ')
          test -n "$UDID"
          echo "Using simulator: $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcodebuild test -scheme BaresipKit-Package -destination "id=${UDID}" 2>&1 | tee xctest.log | grep -E "Test Suite|Executed|error:|Test Case .*failed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" xctest.log
      - name: Build the sample app for the simulator
        run: |
          brew install xcodegen >/dev/null
          cd Examples/SampleApp
          xcodegen generate
          xcodebuild build -project BaresipKitSample.xcodeproj -scheme BaresipKitSample \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO 2>&1 | tee sample.log | grep -E "error:|warning: .*\.swift|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" sample.log
      - name: Sample app UI test (TLS registration with a private CA, pinning, call to a host peer)
        run: |
          HOSTIP=$(ipconfig getifaddr en0 || ipconfig getifaddr en1)
          OUT="$PWD/Build/out/uitest"
          mkdir -p "$OUT"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
            -keyout "$OUT/key.pem" -out "$OUT/cert.pem" -days 2 \
            -subj "/CN=baresipkit-uitest" -addext "subjectAltName=IP:$HOSTIP" >/dev/null 2>&1
          REGISTRAR_HOST="$HOSTIP" REGISTRAR_PORT=5081 REGISTRAR_IDLE_TIMEOUT=900 \
            python3 Tools/ContactParameterProof/tls_registrar.py "$OUT/cert.pem" "$OUT/key.pem" "$OUT/registrar-trace.txt" > "$OUT/registrar.out" 2>&1 &
          BSK_PEER_TIMEOUT=900 Build/out/host/core-tests/tests/bsk_test_call peer "$HOSTIP" > "$OUT/peer.out" 2> "$OUT/peer.err" &
          PEER_PID=$!
          for i in $(seq 1 50); do grep -q READY "$OUT/peer.out" 2>/dev/null && break; sleep 0.2; done
          xcrun simctl boot "$SIM_UDID" || true
          cd Examples/SampleApp
          TEST_RUNNER_BSK_UITEST_HOST="$HOSTIP" TEST_RUNNER_BSK_UITEST_CA_PEM="$(cat "$OUT/cert.pem")" \
            xcodebuild test -project BaresipKitSample.xcodeproj -scheme BaresipKitSample \
            -destination "id=${SIM_UDID}" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= 2>&1 \
            | tee "$OUT/uitest.log" | grep -E "Test Case|error:|XCTAssert|failed|TEST (SUCCEEDED|FAILED)" || true
          if ! grep -q "TEST SUCCEEDED" "$OUT/uitest.log"; then
            tail -60 "$OUT/uitest.log"
            echo "--- registrar trace"; tail -60 "$OUT/registrar-trace.txt" || true
            echo "--- peer"; cat "$OUT/peer.out"; grep -E "CHECK|call|SIP/2.0|INVITE" "$OUT/peer.err" | tail -40 || true
            kill "$PEER_PID" 2>/dev/null || true
            exit 1
          fi
          PEER_RC=0
          wait "$PEER_PID" || PEER_RC=$?
          cat "$OUT/peer.out"
          echo "REGISTER requests seen by the registrar: $(grep -c 'REGISTER sip' "$OUT/registrar-trace.txt" || true)"
          if [[ "$PEER_RC" != 0 ]] || ! grep -q "peer: PASS" "$OUT/peer.out"; then
            grep -E "CHECK|call|SIP/2.0|INVITE" "$OUT/peer.err" | tail -40 || true
            exit 1
          fi
      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: BaresipKitCore.xcframework
          path: |
            Build/out/BaresipKitCore.xcframework.zip
            Build/out/checksum.txt
            Build/out/sizes.txt
      - name: Upload UI test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-uitest-logs
          path: |
            Build/out/uitest/*.txt
            Build/out/uitest/*.log
            Build/out/uitest/*.out
            Build/out/uitest/*.err
          if-no-files-found: ignore

  integration:
    name: Integration against Asterisk and coturn (Docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev zlib1g-dev yasm python3
      - name: Cache pinned sources and built prefix
        uses: actions/cache@v4
        with:
          path: |
            Build/.deps
            Build/out/host/prefix
          key: linux-${{ hashFiles('Build/versions.env', 'Build/module-sets.env', 'Patches/*.patch') }}
      - name: Build host prefix and test binaries
        run: |
          PLATFORM=host MODULE_SET=full JOBS=4 Build/build-xcframework.sh
          BUILD_ONLY=1 HOSTIP=$(hostname -I | awk '{print $1}') PREFIX=Build/out/host/prefix Tests/Core/run_tests.sh
      - name: Run integration suite
        run: |
          HOSTIP=$(hostname -I | awk '{print $1}')
          echo "HOSTIP=$HOSTIP"
          PREFIX=Build/out/host/prefix HOSTIP=$HOSTIP Tests/Integration/run_integration.sh

